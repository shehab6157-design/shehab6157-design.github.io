<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>RightPart</title>
<meta name="description" content="RightPart: assembly guidance for any production company. Each company loads its own parts, BOMs and steps; workers search any code, follow steps in 3D, verify every bin and ask questions answered from the company's own data.">
<meta name="theme-color" content="#1D5BD8">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RightPart">
<link rel="stylesheet" href="css/app.css">
<link rel="modulepreload" href="js/app.js">
<script src="js/theme.js"></script>
</head>
<body>
<a class="skip" href="#main" id="skipLink">Skip to content</a>
<div class="app">
  <header class="topbar">
    <a class="appbrand" href="#/" aria-label="RightPart home"><span class="logo"></span><span class="name">RightPart</span></a>
    <form class="search" role="search" id="topSearch" autocomplete="off">
      <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" name="q" placeholder="Any code, size or name: 100-0233, C-55013, M3x8…" aria-label="Search any code, size or name, or ask a question" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false" enterkeyhint="search" spellcheck="false" autocapitalize="characters">
      <div class="acts">
        <button type="button" id="scanBtn" title="Scan a barcode" aria-label="Scan a barcode"></button>
        <button type="button" id="photoBtn" title="Identify by photo or size" aria-label="Identify a part by photo or size"></button>
      </div>
      <div class="suggest hidden" id="suggest" role="listbox" aria-label="Suggestions"></div>
    </form>
    <div class="top-actions">
      <button class="ws-btn" id="wsBtn" type="button" aria-haspopup="dialog" aria-label="Switch company"></button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch light or dark theme"></button>
      <a class="icon-btn hide-sm" href="#/about" aria-label="About RightPart" id="aboutBtn"></a>
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-haspopup="dialog" aria-label="Menu"></button>
    </div>
  </header>
  <div class="shell">
    <nav class="sidenav" aria-label="Main" id="sidenav"></nav>
    <main id="main" tabindex="-1"><div class="skeleton"><div class="spinner" role="status" aria-label="Loading"></div></div></main>
  </div>
  <nav class="bottomnav" aria-label="Main" id="bottomnav"></nav>
  <button class="ask-fab" id="askFab" type="button" aria-haspopup="dialog" aria-label="Ask a question about parts and steps"></button>
</div>
<noscript><p style="padding:24px">RightPart needs JavaScript to run.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
