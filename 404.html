<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Empty cell | Shehab Shibli</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0D0905">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230D0905'/%3E%3Cpath d='M32 7 53.6 19.5v25L32 57 10.4 44.5v-25z' fill='none' stroke='%23E3B04B' stroke-width='3.4' stroke-linejoin='round'/%3E%3Cpath d='M32 20.5 43 26.8v12.4L32 45.5 21 39.2V26.8z' fill='%23FFB43F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Instrument+Sans:wght@400..600&display=swap">
<style>
/* One empty cell of the comb, lit from behind; the hive itself sits soft and dark under it. Tokens match index.html. */
:root{--propolis:#0D0905;--wax:#F3E8D2;--wax-2:#CDBB9E;--wax-3:#A99677;--gold:#E3B04B;--honey:#FFB43F;
  --f-display:"Bodoni Moda","Bodoni 72",Didot,Georgia,serif;--f-body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;--e-out:cubic-bezier(.16,1,.3,1);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:24px 16px;background:var(--propolis);color:var(--wax-2);font:400 17px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
.bg{position:fixed;inset:-40px;z-index:-1;background:url(/hive-1280.webp) 62% 50%/cover no-repeat,var(--propolis);filter:blur(26px) brightness(.42) saturate(1.1)}
main{display:grid;justify-items:center;gap:20px;max-width:540px;text-align:center}
.cell{width:132px;height:152px;filter:drop-shadow(0 0 40px rgb(255 170 60 / .28));animation:in 1100ms var(--e-out) both}
.cell .o{fill:none;stroke:var(--gold);stroke-width:2.4;stroke-linejoin:round}
.cell .i{fill:rgb(13 9 5 / .85);stroke:rgb(227 176 75 / .35);stroke-width:1}
.cell .g{fill:url(#glow)}
@keyframes in{from{opacity:0;transform:translateY(12px);filter:blur(8px)}to{opacity:1;transform:none}}
.code{margin:0;color:var(--wax-3);font:500 14px/1 var(--f-body);letter-spacing:.06em}
h1{margin:0;color:var(--wax);font:500 clamp(42px,7vw,68px)/1 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
p{margin:0;max-width:40ch}
a.btn{display:inline-flex;align-items:center;min-height:48px;margin-top:6px;padding:0 22px;border-radius:14px;corner-shape:bevel;background:linear-gradient(180deg,#FADD9C 0%,#EDBF60 46%,#C98F37 100%);color:#1B1106;font:600 15px/1 var(--f-body);text-decoration:none;box-shadow:inset 0 1px 0 rgb(255 249 228 / .75),inset 0 -1px 0 rgb(110 64 16 / .55),0 12px 30px -14px rgb(255 170 50 / .5);transition:filter 200ms ease-out}
a.btn:hover{filter:brightness(1.07)}
a.btn:focus-visible{outline:2px solid var(--honey);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.cell{animation:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main>
  <svg class="cell" viewBox="0 0 132 152" aria-hidden="true">
    <defs><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFB43F" stop-opacity=".22"/><stop offset="1" stop-color="#FFB43F" stop-opacity="0"/></radialGradient></defs>
    <path class="o" d="M66 3 127 38.5v75L66 149 5 113.5v-75z"/>
    <path class="i" d="M66 14 117.5 44v64L66 138 14.5 108V44z"/>
    <path class="g" d="M66 14 117.5 44v64L66 138 14.5 108V44z"/>
  </svg>
  <p class="code">Error 404</p>
  <h1>This cell is empty</h1>
  <p>The page you were looking for isn't in the comb. Everything else is one step away.</p>
  <a class="btn" href="/">Back to the portfolio</a>
</main>
</body>
</html>
