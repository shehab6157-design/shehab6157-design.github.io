<style>
/* Layout: one centered glass objective with an empty slot where the specimen should be, under three soft lamps. Tokens match index.html. */
:root{
  --ground:#05060C; --stage:#0B0E1A; --hair:#1C2135; --hair-2:#2B324D;
  --bone:#EEF0F7; --mute:#AEB4C8; --faint:#A4ABC2; --lumen:#F2D49B; --lumen-ink:#1A1408;
  --pol-v:#8A7BFF; --pol-m:#E85CCB; --pol-c:#46D5F5;
  --host:#7C9CFF; --net:#4FE3A1; --auth:#F25CCF;
  --f-display:"Newsreader","Iowan Old Style",Georgia,serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --e-out:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(60vmax 50vmax at 12% 18%,rgb(79 227 161 / .14),transparent 70%),radial-gradient(60vmax 50vmax at 88% 22%,rgb(124 156 255 / .16),transparent 70%),radial-gradient(70vmax 50vmax at 50% 105%,rgb(242 92 207 / .15),transparent 70%),var(--ground);background-attachment:fixed;color:var(--bone);font:400 17px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px 16px}
main{display:grid;justify-items:center;gap:22px;text-align:center;max-width:560px}
.lens{position:relative;width:min(300px,72vw);aspect-ratio:1/1;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px rgb(255 255 255 / .16),0 0 0 7px rgb(16 18 34 / .92),0 0 0 8px rgb(255 255 255 / .1),0 0 80px -16px color-mix(in srgb,var(--pol-v) 45%,transparent),0 50px 100px -50px #000;animation:in 1200ms var(--e-out) both}
.lens::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(ellipse 30% 13% at 31% 23%,rgb(255 255 255 / .2),transparent 70%),radial-gradient(circle,transparent 68%,rgb(0 0 0 / .38) 100%);box-shadow:inset 0 0 0 1.5px rgb(255 255 255 / .1),inset 0 0 34px -8px color-mix(in srgb,var(--pol-c) 55%,transparent)}
.lens canvas{position:absolute;inset:0;width:100%;height:100%}
@keyframes in{from{opacity:0;transform:scale(.96);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.code{font:500 12px/1.4 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--auth)}
h1{margin:0;font:300 clamp(40px,7vw,64px)/1 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
p{margin:0;color:var(--mute);max-width:42ch}
a.btn{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 20px;border-radius:999px;background:linear-gradient(180deg,#FFEDC6,#F6D490 46%,#E9BC6A);color:var(--lumen-ink);box-shadow:inset 0 1px 0 rgb(255 255 255 / .8),inset 0 -3px 6px rgb(122 74 6 / .3),0 0 0 1px rgb(255 230 175 / .5),0 14px 30px -12px rgb(242 196 110 / .55);font:500 15px/1 var(--f-body);text-decoration:none;transition:transform 140ms ease-out}
a.btn:hover{transform:translateY(-1px)}
a.btn:focus-visible{outline:2px solid var(--lumen);outline-offset:3px}
@media (prefers-reduced-motion: reduce){.lens{animation:none}}
</style>
</head>
<body>
<main>
  <div class="lens"><canvas id="cv" aria-hidden="true"></canvas></div>
  <p class="code">404 · empty slide</p>
  <h1>Specimen not found</h1>
  <p>This page isn't in the collection. The rest of the work is still under the microscope.</p>
  <a class="btn" href="/">Back to the portfolio</a>
</main>
<script>
(() => {
  const cv = document.getElementById("cv"), ctx = cv.getContext && cv.getContext("2d"); if (!ctx) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cs = getComputedStyle(document.documentElement), tk = n => cs.getPropertyValue(n).trim();
  const HOST = tk("--host"), AUTH = tk("--auth"), BONE = tk("--bone");
  let w = 0, h = 0, R = 0;
  const cells = []; let k = 0; const rnd = () => { const x = Math.sin(++k * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
  for (let i = 0; i < 18; i++){ const a = i / 18 * 6.283 + rnd() * .5, r = .32 + rnd() * .48; cells.push({x:Math.cos(a) * r, y:Math.sin(a) * r, s:.04 + rnd() * .03, ph:rnd() * 6.283}); }
  function size(){ const b = cv.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2); w = b.width; h = b.height; R = Math.min(w, h) / 2; cv.width = w * d; cv.height = h * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
  function draw(t){
    ctx.clearRect(0, 0, w, h);
    const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, R); g.addColorStop(0, "rgba(124,156,255,.08)"); g.addColorStop(1, "rgba(124,156,255,0)"); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    for (const c of cells){
      const x = w / 2 + (c.x + Math.sin(t * .4 + c.ph) * .02) * R, y = h / 2 + (c.y + Math.cos(t * .33 + c.ph) * .02) * R, r = c.s * R;
      const gg = ctx.createRadialGradient(x, y, 0, x, y, r * 2.2); gg.addColorStop(0, "rgba(124,156,255,.9)"); gg.addColorStop(.35, "rgba(124,156,255,.35)"); gg.addColorStop(1, "rgba(124,156,255,0)");
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(x, y, r * 2.2, 0, 6.283); ctx.fill();
    }
    // the empty slot where a specimen should be
    const pr = R * (.2 + .015 * Math.sin(t * 2));
    ctx.setLineDash([4, 6]); ctx.lineDashOffset = -t * 12; ctx.strokeStyle = AUTH; ctx.globalAlpha = .85; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(w / 2, h / 2, pr, 0, 6.283); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    ctx.fillStyle = BONE; ctx.globalAlpha = .7; ctx.font = '500 11px "IBM Plex Mono", monospace'; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("?", w / 2, h / 2); ctx.globalAlpha = 1;
    const v = ctx.createRadialGradient(w / 2, h / 2, R * .6, w / 2, h / 2, R); v.addColorStop(0, "rgba(5,6,12,0)"); v.addColorStop(1, "rgba(5,6,12,1)"); ctx.fillStyle = v; ctx.fillRect(0, 0, w, h);
  }
  size(); addEventListener("resize", () => { size(); draw(performance.now() / 1000); });
  if (reduce){ draw(0); return; }
  const loop = now => { draw(now / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop);
})();
</script>
</body>
</html>
